# dsh-skin bundle patch.
#
# `dsh plugin --profile <p> add <pkg>` mounts this entry automatically because
# package.json declares dsh.bundle.patch. Keep insert[].id equal to the package
# name: DSH derives the plugin's identity from this id and the client half is
# loaded under the same id.
- insert:
    - id: dsh-skin
      name: dsh-skin
